<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<title>Sift — Archive</title>
<style>
:root {
  --bg: #0a0a0c; --surface: #111114; --surface-2: #18181c;
  --border: #2a2a30; --text: #e8e6e3; --text-dim: #a8a5a0;
  --text-muted: #6b6966; --accent-claude: #ff6b35;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif; line-height: 1.6;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
.container { max-width: 720px; margin: 0 auto; padding: 0 1.5rem; }
nav {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 720px; margin: 0 auto; padding: 1.5rem;
}
.nav-brand {
  font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem;
  font-weight: 700; letter-spacing: 0.08em;
}
.nav-links a {
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted); transition: color 0.2s ease;
}
.nav-links a:hover { color: var(--text); }
.nav-links a.active { color: var(--accent-claude); }

h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.8rem; font-weight: 600;
  padding: 2rem 0 1rem;
}
.month-group {
  margin-bottom: 2rem;
}
.month-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; font-weight: 400;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-muted); padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border); margin-bottom: 0.5rem;
}
.edition-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.6rem 0;
  border-bottom: 1px solid rgba(42, 42, 48, 0.2);
}
.edition-row a {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.9rem; font-weight: 500;
  transition: color 0.2s ease;
}
.edition-row a:hover { color: var(--accent-claude); }
.edition-row .meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; color: var(--text-muted);
}

footer {
  border-top: 1px solid var(--border);
  padding: 2rem 0; text-align: center;
}
footer p {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; color: var(--text-muted);
}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">Sift</a>
  <div class="nav-links">
    <a href="/issues/" class="active">Archive</a>
  </div>
</nav>

<div class="container">
  <h1>Archive</h1>

  <!-- ARCHIVE_START -->
  <div class="month-group"><div class="month-label">No editions yet</div></div>
  <!-- ARCHIVE_END -->
</div>

<footer>
  <div class="container">
    <p>Sift · AI Daily Digest · Generated by Claude Code</p>
  </div>
</footer>
</body>
</html>
