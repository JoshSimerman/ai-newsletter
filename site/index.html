<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<title>Sift — AI Daily Digest</title>
<meta name="description" content="Daily AI news digest covering Claude, OpenAI, new models, local AI, business deals, developer tools, and open source.">
<style>
:root {
  --bg: #0a0a0c; --surface: #111114; --surface-2: #18181c;
  --border: #2a2a30; --text: #e8e6e3; --text-dim: #a8a5a0;
  --text-muted: #6b6966; --accent-claude: #ff6b35;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif; font-weight: 400;
  line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

.container { max-width: 720px; margin: 0 auto; padding: 0 1.5rem; }

nav {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 720px; margin: 0 auto; padding: 1.5rem;
}
.nav-brand {
  font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem;
  font-weight: 700; letter-spacing: 0.08em; color: var(--text);
}
.nav-links a {
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted); transition: color 0.2s ease;
}
.nav-links a:hover { color: var(--text); }

.hero {
  padding: 4rem 0 3rem;
  text-align: center;
}
.hero h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 2.5rem; font-weight: 700;
  letter-spacing: -0.02em; margin-bottom: 0.75rem;
}
.hero p {
  font-size: 1rem; color: var(--text-dim);
  max-width: 500px; margin: 0 auto;
}
.hero .tagline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; color: var(--text-muted);
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 1rem;
}

.latest-link {
  display: inline-block;
  margin-top: 2rem;
  padding: 0.6rem 1.5rem;
  background: var(--accent-claude);
  color: #fff;
  border-radius: 6px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  transition: opacity 0.2s ease;
}
.latest-link:hover { opacity: 0.85; }

.editions-list {
  padding: 2rem 0 4rem;
}
.editions-list h2 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; font-weight: 400;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 1rem;
  padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
}
.edition-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.75rem 0;
  border-bottom: 1px solid rgba(42, 42, 48, 0.3);
}
.edition-item a {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.95rem; font-weight: 500;
  color: var(--text); transition: color 0.2s ease;
}
.edition-item a:hover { color: var(--accent-claude); }
.edition-item .edition-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; color: var(--text-muted);
}

footer {
  border-top: 1px solid var(--border);
  padding: 2rem 0; text-align: center;
}
footer p {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; color: var(--text-muted);
}

@media (max-width: 640px) {
  .container, nav { padding-left: 1rem; padding-right: 1rem; }
  .hero h1 { font-size: 1.8rem; }
}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">Sift</a>
  <div class="nav-links">
    <a href="/issues/">Archive</a>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <div class="tagline">AI Daily Digest</div>
    <h1>Sift</h1>
    <p>Daily AI news — models, tools, deals, and code — aggregated, deduplicated, and delivered.</p>
    <!-- LATEST_EDITION_LINK -->
  </div>

  <div class="editions-list">
    <h2>Recent Editions</h2>
    <!-- EDITION_LIST_START -->
    <div class="edition-item"><span style="color: var(--text-muted); font-size: 0.85rem;">No editions yet.</span></div>
    <!-- EDITION_LIST_END -->
  </div>
</div>

<footer>
  <div class="container">
    <p>Generated by Claude Code · Powered by Cloudflare Pages</p>
  </div>
</footer>
</body>
</html>
